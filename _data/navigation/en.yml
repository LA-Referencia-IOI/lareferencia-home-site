main_nav:
  - label: Technology and projects
    href: /en/services/platform-la-referencia
    match: /services/
    groups:
      - title: Technology
        children:
          - label: LA Referencia Platform
            href: /en/services/platform-la-referencia
            summary: Harvests information from scientific repositories, checks its quality and enriches it to increase its visibility and share it with other systems.
            show_full_summary: true
            menu_icon: search
          - label: Usage Statistics
            href: https://ustats.lareferencia.info/en/home
            summary: Collects views and downloads to show how repository content is used and provide usage statistics.
            show_full_summary: true
            menu_icon: stats
            external: true
          - label: "dARK: persistent identifiers"
            href: https://la-referencia-ioi.github.io/reports/productos/b1-dark-2/en/index.html
            summary: Regional infrastructure under development to assign ARK identifiers, maintain stable links to scientific resources and preserve their metadata.
            show_full_summary: true
            menu_icon: dark
            external: true
      - title: Projects
        children:
          - label: LA Referencia IOI Project
            href: https://la-referencia-ioi.github.io/reports/en/index.html
            summary: Expands the regional collection and makes it easier to search in multiple languages. Develops dARK identifiers and metadata preservation, alongside a Dataverse repository and training to manage research data.
            show_full_summary: true
            menu_icon: generic
            external: true
          - label: Project LA Referencia/Lyrasis DSpace
            href: https://dspace.lareferencia.info/en/
            summary: Helps institutions install, use and update DSpace through technical support, Spanish and Portuguese guides and training activities.
            show_full_summary: true
            menu_icon: db
            external: true

  - label: Resources
    href: /en/news
    match: /resources/
    matches:
      - /news
    page_menu: resources
    mega_title: Resources
    mega_subtitle: News, surveys and newsletter subscription.
    children:
      - label: Training Platform
        href: https://cursos.lareferencia.info/
        summary: Expand your knowledge of Open Science with LA Referencia's Training Platform.
        menu_icon: graduation-cap
        external: true
      - label: Institutional Documents
        href: https://recursos.lareferencia.info/
        summary: Repository of LA Referencia institutional documents.
        menu_icon: docs
        external: true
        menu_order: 5

  - label: Member countries
