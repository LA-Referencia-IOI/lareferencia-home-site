main_nav:
  - label: Tecnología y proyectos
    href: /es/services/plataforma-la-referencia
    match: /services/
    groups:
      - title: Tecnología
        children:
          - label: Plataforma LA Referencia
            href: /es/services/plataforma-la-referencia
            summary: Conozca más sobre el software utilizado para recopilar datos de los nodos nacionales.
            menu_icon: search
          - label: Estadísticas de Uso
            href: https://ustats.lareferencia.info/es/home
            summary: Descubra cómo nuestra plataforma brinda acceso a los datos de uso de los repositorios en toda la red.
            menu_icon: stats
            external: true
          - label: dARK
            href: https://www.dark-pid.net/es/home
            summary: Explore cómo se desarrolló esta herramienta para asignar identificadores persistentes.
            menu_icon: dark
            external: true
      - title: Proyectos
        children:
          - label: LA Referencia proyecto IOI
            href: https://la-referencia-ioi.github.io/reports/en/index.html
            summary: Conozca los reportes del proyecto LA Referencia - IOI sobre infraestructura abierta en la región.
            menu_icon: generic
            external: true
          - label: Proyecto LA Referencia/Lyrasis DSpace
            href: https://dspace.lareferencia.info/pt/
            menu_icon: db
            external: true

  - label: Recursos
    href: /es/news
    match: /resources/
    matches:
      - /news
    page_menu: resources
    mega_title: Recursos
    mega_subtitle: Noticias, relevamientos y suscripción institucional.
    children:
      - label: Documentos institucionales
        href: https://recursos.lareferencia.info/
        summary: Repositorio de documentos institucionales de LA Referencia.
        menu_icon: docs
        external: true
        menu_order: 1
      - label: Plataforma de Capacitación
        href: https://cursos.lareferencia.info/
        summary: Expanda sus conocimientos sobre Ciencia Abierta de la mano de la Plataforma de Capacitación de LA Referencia.
        menu_icon: graduation-cap
        external: true
        menu_order: 3

  - label: Países miembro
    href: /es/miembros/
