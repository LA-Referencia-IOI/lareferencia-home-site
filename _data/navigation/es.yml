read_more_label: Leer más...

main_nav:
  - label: Tecnología y proyectos
    href: /es/services/plataforma-la-referencia
    match: /services/
    groups:
      - title: Tecnología
        children:
          - label: Plataforma LA Referencia
            href: /es/services/plataforma-la-referencia
            summary: Cosecha información de repositorios científicos, revisa su calidad y la enriquece para visibilizarla y compartirla con otros sistemas.
            show_full_summary: true
            menu_icon: search
          - label: Estadísticas de Uso
            href: https://ustats.lareferencia.info/es/home
            summary: Recopila consultas y descargas para conocer cómo se utilizan los contenidos de los repositorios y mostrar sus estadísticas.
            show_full_summary: true
            menu_icon: stats
            external: true
          - label: "dARK: identificadores persistentes"
            href: https://la-referencia-ioi.github.io/reports/productos/b1-dark-2/es/index.html
            summary: Infraestructura regional en desarrollo para asignar identificadores ARK, mantener enlaces estables a recursos científicos y preservar sus metadatos.
            show_full_summary: true
            menu_icon: dark
            external: true
      - title: Proyectos
        children:
          - label: LA Referencia proyecto IOI
            href: https://la-referencia-ioi.github.io/reports/index.html
            summary: Amplía la colección regional y facilita la búsqueda en varios idiomas. Desarrolla identificadores dARK y preservación de metadatos, además de un repositorio Dataverse y formación para gestionar datos de investigación.
            show_full_summary: true
            menu_icon: generic
            external: true
          - label: Proyecto LA Referencia/Lyrasis DSpace
            href: https://dspace.lareferencia.info/
            summary: Ayuda a las instituciones a instalar, utilizar y actualizar DSpace con soporte técnico, guías en español y portugués y actividades de capacitación.
            show_full_summary: true
            menu_icon: db
            external: true

  - label: Recursos
    href: /es/news
    match: /resources/
    matches:
      - /news
    page_menu: resources
    mega_title: Recursos
    mega_subtitle: Noticias, relevamientos y suscripción institucional.
    children:
      - label: Documentos institucionales
        href: https://recursos.lareferencia.info/
        summary: Repositorio de documentos institucionales de LA Referencia.
        menu_icon: docs
        external: true
        menu_order: 1
      - label: Plataforma de Capacitación
        href: https://cursos.lareferencia.info/
        summary: Expanda sus conocimientos sobre Ciencia Abierta de la mano de la Plataforma de Capacitación de LA Referencia.
        menu_icon: graduation-cap
        external: true
        menu_order: 3

  - label: Países miembro
    href: /es/miembros/
    matches:
      - /miembros/
      - /about/como-ser-parte
    page_menu: members
    mega_title: Países miembro
    mega_subtitle: Integración en la red y países miembros.
    cta:
      label: Leer más...
      href: /es/miembros/beneficios/
    cta_title: Beneficios
    cta_text: Conozca la propuesta de valor de ser parte de LA Referencia.
    cta_image: /assets/img/futuristic-finance-digital-market-graph-user-interface-with-diagram-technology-hud-graphic-concept.jpg

  - label: Noticias
    href: /es/news
    match: /news

  - label: Acerca de
