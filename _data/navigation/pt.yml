main_nav:
  - label: Tecnologia e projetos
    href: /pt/services/plataforma-la-referencia
    match: /services/
    groups:
      - title: Tecnologia
        children:
          - label: Plataforma LA Referencia
            href: /pt/services/plataforma-la-referencia
            summary: Coleta informações de repositórios científicos, verifica sua qualidade e as enriquece para dar visibilidade a elas e compartilhá-las com outros sistemas.
            show_full_summary: true
            menu_icon: search
          - label: Estatísticas de uso
            href: https://ustats.lareferencia.info/pt/home
            summary: Coleta consultas e downloads para mostrar como os conteúdos dos repositórios são utilizados e oferecer estatísticas de uso.
            show_full_summary: true
            menu_icon: stats
            external: true
          - label: "dARK: identificadores persistentes"
            href: https://la-referencia-ioi.github.io/reports/productos/b1-dark-2/pt/index.html
            summary: Infraestrutura regional em desenvolvimento para atribuir identificadores ARK, manter links estáveis para recursos científicos e preservar seus metadados.
            show_full_summary: true
            menu_icon: dark
            external: true
      - title: Projetos
        children:
          - label: LA Referencia projeto IOI
            href: https://la-referencia-ioi.github.io/reports/index.html
            summary: Amplia a coleção regional e facilita a busca em vários idiomas. Desenvolve identificadores dARK e preservação de metadados, além de um repositório Dataverse e capacitação para gerenciar dados de pesquisa.
            show_full_summary: true
            menu_icon: generic
            external: true
          - label: Projeto LA Referencia/Lyrasis DSpace
            href: https://dspace.lareferencia.info/pt/
            summary: Ajuda as instituições a instalar, utilizar e atualizar o DSpace com suporte técnico, guias em espanhol e português e atividades de capacitação.
            show_full_summary: true
            menu_icon: db
            external: true

  - label: Recursos
    href: /pt/news
    match: /resources/
    matches:
      - /news
    page_menu: resources
    mega_title: Recursos
    mega_subtitle: Notícias, levantamentos e assinatura institucional.
