sections:
  - type: hero_map
    title: "LA Referencia é a Rede Latino-Americana e Espanhola de Ciência Aberta"
    subtitle: "A LA Referencia dá suporte às estratégias nacionais de Ciência Aberta na América Latina e na Espanha por meio de sua gama de serviços."

  - type: explore_band
    title: "Explore os resultados de pesquisa científica em acesso aberto"
    placeholder: "Pesquisar nas publicações"
    button_label: "Explorar a Rede"

  - type: band_message
    text: "Navegue por publicações científicas em Acesso Aberto da América Latina e da Espanha"

  - type: search_stats
    action_url: "https://www.lareferencia.info/vufind/Search/Results"
    method: "get"
    query_param: "lookfor"
    scope_param: "type"
    placeholder: "Começar busca"
    scope_options:
      - label: "Todos os campos"
        value: "AllFields"
      - label: "Título"
        value: "Title"
      - label: "Autor"
        value: "Author"
    search_label: "Buscar"
    advanced_label: "Busca avançada"
    advanced_url: "https://www.lareferencia.info/vufind/Search/Advanced"
    metrics:
      nodes_label: "Países membros"
      nodes_value: "10"
      documents_label: "Documentos"
      documents_value: "5.820.482"
      breakdown:
        - label: "Artigo"
          value: "3.578.992"
        - label: "Tese"
          value: "1.288.071"
        - label: "Tese doutoral"
          value: "621.180"
        - label: "Capítulo"
          value: "112.471"

  - type: faq_cta
    title: "Quais medidas devo tomar se minha pesquisa ou repositório institucional não estiver disponível na LA Referencia?"
    body: "A LA Referencia é um agregador que coleta metadados dos repositórios dos países participantes por esse motivo não é possível depositar diretamente seus resultados de pesquisa. No entanto, você pode encontrar as informações necessárias clicando no link a seguir."
    button_label: "Saiba mais"
    button_url: "/pt/about/como-participar"
    image: "/assets/img/faq.svg"

  - type: resources_cards
    cards:
      - title: "Instalação e configuração básica do DSpace 7.5"
        summary: "Guillermo Esteban Murillo Goussen, técnico da LA Referencia, explica os detalhes da instalação e configuração básica do DSpace 7.5."
        button_label: "Ir ao recurso"
        button_url: "https://recursos.lareferencia.info/download/instalacion-y-configuracion-basica-de-dspace-7-5/"
      - title: "Acesso aos dados de produção científica financiados com recursos públicos: DATACIENCIA"
        summary: "Painelista: Carolina González."
        button_label: "Ir ao recurso"
        button_url: "https://recursos.lareferencia.info/download/acceso-a-los-datos-de-produccion-cientifica-financiados-con-fondos-publicos-dataciencia/"
      - title: "Experiências na migração de repositórios institucionais DSpace"
        summary: "Palestrante: Ariel Lira, PREBI-SEDICI, Universidad Nacional de La Plata, Argentina."
        button_label: "Ir ao recurso"
        button_url: "https://recursos.lareferencia.info/download/experiencias-en-la-migracion-de-repositorios-institucionales-dspace/"
      - title: "Expansão regional e cobertura"
        summary: "Explica como COAR IRD, ROR, os sistemas nacionais e o trabalho direto com organizações permitem ampliar a cobertura para países membros e não membros."
        button_label: "Ver página"
        button_url: "https://la-referencia-ioi.github.io/reports/productos/a1-expansion-regional/es/index.html"
      - title: "Busca semântica multilíngue"
        summary: "Explica como a busca por significado complementa a recuperação por palavras e permite testar consultas em sete idiomas sobre a coleção da LA Referencia."
        button_label: "Ver página"
        button_url: "https://la-referencia-ioi.github.io/lareferencia-semantic-demo/?lang=pt"
      - title: "Proteção seletiva contra bots e scraping"
        summary: "Explica a solução com Anubis e Nginx Proxy Manager para distinguir serviços acadêmicos autorizados, scrapers identificados e navegadores convencionais."
        button_label: "Ver página"
        button_url: "https://la-referencia-ioi.github.io/lareferencia-anubis-demo/?lang=pt"
      - title: "Seleção de um modelo para busca semântica multilíngue"
        summary: "Explica o que é um modelo de embeddings, como as alternativas foram avaliadas e por que o BGE-M3 foi selecionado para a primeira implementação."
        button_label: "Ver página"
        button_url: "https://la-referencia-ioi.github.io/reports/productos/a4-seleccion-modelos/pt/index.html"
      - title: "dARK: identificadores persistentes como bem público regional"
        summary: "Explica o problema, o esquema ARK e o modelo conceitual descentralizado que o projeto busca consolidar na região."
        button_label: "Ver página"
        button_url: "https://la-referencia-ioi.github.io/reports/productos/b1-dark-2/pt/index.html"
      - title: "dARK 2.0: arquitetura técnica e operação multissite"
        summary: "Explica o ciclo de atribuição e resolução, as APIs, blockchain, IPFS e o modelo de infraestrutura distribuída entre sedes."
        button_label: "Ver página"
        button_url: "https://la-referencia-ioi.github.io/reports/productos/b2-infraestructura-multisitio/pt/index.html"
      - title: "Dataverse Alpha regional"
        summary: "O ambiente Alpha da LA Referencia está operacional. A página documenta a linha de base, os exemplos autorizados, a capacitação e os próximos pilotos para construir capacidades regionais."
        button_label: "Ver página"
        button_url: "https://la-referencia-ioi.github.io/reports/productos/c1-dataverse-alpha/pt/index.html"
      - title: "Introdução à gestão e curadoria de dados no Dataverse"
        summary: "A primeira turma começou em 24 de agosto de 2026. O MOOC assíncrono de 16 horas libera quatro módulos progressivamente e conecta a formação com práticas no Dataverse Alpha."
        button_label: "Ver curso e andamento"
        button_url: "https://la-referencia-ioi.github.io/reports/productos/c2-curso-curaduria-datos/pt/index.html"

