  - type: faq_cta
    title: "What steps should I take if my research or institutional repository is not available in LA Referencia?"
    body: "LA Referencia is an aggregator that harvests metadata from the repositories of the participating countries. For this reason, it is not possible to directly deposit your research outputs. However, you can find the necessary information by clicking the following link."
    button_label: "Learn more"
    button_url: "/en/about/how-to-join"
    image: "/assets/img/faq.svg"

