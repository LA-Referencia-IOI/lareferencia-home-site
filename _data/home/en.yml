sections:
  - type: hero_map
    title: "LA Referencia.<br>Latin American and Spanish Network<br>for Open Science"
    subtitle: "LA Referencia supports national Open Science strategies in Latin America and Spain through its range of services."

  - type: explore_band
    title: "Browse scientific research outputs in Open Access"
    placeholder: "Search publications"
    button_label: "Explore Network"

  - type: band_message
    text: "Browse Open Access scientific publications from Latin America and Spain"

  - type: search_stats
    action_url: "https://www.lareferencia.info/vufind/Search/Results"
    method: "get"
    query_param: "lookfor"
    scope_param: "type"
    placeholder: "Start searching"
    scope_options:
      - label: "All fields"
        value: "AllFields"
      - label: "Title"
        value: "Title"
      - label: "Author"
        value: "Author"
    search_label: "Search"
    advanced_label: "Advanced search"
    advanced_url: "https://www.lareferencia.info/vufind/Search/Advanced"
    metrics:
      nodes_label: "Member countries"
      nodes_value: "10"
      documents_label: "Documents"
      documents_value: "5,820,482"
      breakdown:
        - label: "Article"
          value: "3,578,992"
        - label: "Thesis"
          value: "1,288,071"
        - label: "Doctoral thesis"
          value: "621,180"
        - label: "Book chapter"
          value: "112,471"

  - type: faq_cta
    title: "What steps should I take if my research or institutional repository is not available in LA Referencia?"
    body: "LA Referencia is an aggregator that harvests metadata from the repositories of the participating countries. For this reason, it is not possible to directly deposit your research outputs. However, you can find the necessary information by clicking the following link."
    button_label: "Learn more"
    button_url: "/en/about/how-to-join"
    image: "/assets/img/faq.svg"

  - type: resources_cards
    cards:
      - title: "Basic installation and configuration of DSpace 7.5"
        summary: "Guillermo Esteban Murillo Goussen, LA Referencia technician, explains the details of the basic installation and configuration of DSpace 7.5."
        button_label: "Go to resource"
        button_url: "https://recursos.lareferencia.info/download/instalacion-y-configuracion-basica-de-dspace-7-5/"
      - title: "Access to publicly funded scientific output data: DATACIENCIA"
        summary: "Panelist: Carolina González."
        button_label: "Go to resource"
        button_url: "https://recursos.lareferencia.info/download/acceso-a-los-datos-de-produccion-cientifica-financiados-con-fondos-publicos-dataciencia/"
      - title: "Experiences in migrating DSpace institutional repositories"
        summary: "Speaker: Ariel Lira, PREBI-SEDICI, Universidad Nacional de La Plata, Argentina."
        button_label: "Go to resource"
        button_url: "https://recursos.lareferencia.info/download/experiencias-en-la-migracion-de-repositorios-institucionales-dspace/"
      - title: "Regional expansion and coverage"
        summary: "Explains how COAR IRD, ROR, national systems and direct work with organizations extend coverage to member and non-member countries."
        button_label: "View page"
        button_url: "https://la-referencia-ioi.github.io/reports/productos/a1-expansion-regional/en/index.html"
      - title: "Multilingual semantic search"
        summary: "Explains how search by meaning complements keyword retrieval and lets you test queries in seven languages over the LA Referencia collection."
        button_label: "View page"
        button_url: "https://la-referencia-ioi.github.io/lareferencia-semantic-demo/?lang=en"
      - title: "Selective protection against bots and scraping"
        summary: "Explains the Anubis and Nginx Proxy Manager solution to distinguish authorized academic services, identified scrapers and regular browsers."
        button_label: "View page"
        button_url: "https://la-referencia-ioi.github.io/lareferencia-anubis-demo/?lang=en"
      - title: "Selecting a model for multilingual semantic search"
        summary: "Explains what an embeddings model is, how the alternatives were evaluated and why BGE-M3 was selected for the first implementation."
        button_label: "View page"
        button_url: "https://la-referencia-ioi.github.io/reports/productos/a4-seleccion-modelos/en/index.html"
      - title: "dARK: persistent identifiers as a regional public good"
        summary: "Explains the problem, the ARK scheme and the decentralized conceptual model the project aims to consolidate in the region."
        button_label: "View page"
        button_url: "https://la-referencia-ioi.github.io/reports/productos/b1-dark-2/en/index.html"
      - title: "dARK 2.0: technical architecture and multi-site operation"
        summary: "Explains the attribution and resolution cycle, the APIs, blockchain, IPFS and the infrastructure model distributed across sites."
        button_label: "View page"
        button_url: "https://la-referencia-ioi.github.io/reports/productos/b2-infraestructura-multisitio/en/index.html"
      - title: "Regional Dataverse Alpha"
        summary: "The LA Referencia Alpha environment is operational. The page documents the baseline, authorized examples, training and upcoming pilots to build regional capacity."
        button_label: "View page"
        button_url: "https://la-referencia-ioi.github.io/reports/productos/c1-dataverse-alpha/en/index.html"
      - title: "Introduction to data management and curation in Dataverse"
        summary: "The first cohort started on August 24, 2026. The 16-hour asynchronous MOOC releases four modules progressively and links training to practice in Dataverse Alpha."
        button_label: "View course and progress"
        button_url: "https://la-referencia-ioi.github.io/reports/productos/c2-curso-curaduria-datos/en/index.html"

