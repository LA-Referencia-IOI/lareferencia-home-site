<section class="lr-resources">
  <div class="wrapper">
    <div class="lr-resources-grid">
      {% for card in include.section.cards %}
      {% assign card_url = card.button_url | default: '#' %}
      <article class="lr-resource-card">
        <div class="lr-resource-content">
          <h3>{{ card.title }}</h3>
          <p>{{ card.summary }}</p>
          <a class="lr-btn lr-btn-outline-light"
            href="{% if card_url contains '://' %}{{ card_url }}{% else %}{{ card_url | relative_url }}{% endif %}">{{
            card.button_label | default: "Ir al recurso" }}</a>
        </div>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
